name: Build AdSkip APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/adskip
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AdSkip"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.adskip"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.adskip"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">广告跳过助手</string>
              <string name="accessibility_description">只查找界面上明确标注为“跳过”或“Skip”的控件，并尝试点击。</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SkipService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_description"
              android:notificationTimeout="250" />
          EOF

          cat > app/src/main/java/com/example/adskip/MainActivity.kt <<'EOF'
          package com.example.adskip

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                  }

                  val title = TextView(this).apply {
                      text = "广告跳过助手"
                      textSize = 24f
                  }

                  val info = TextView(this).apply {
                      text = "本应用只会尝试点击界面上明确写着“跳过”“跳过广告”或“Skip”的按钮。它不能屏蔽所有广告，也不能保证每个应用都能识别。\\n\\n开启无障碍权限后，Android 会允许本应用读取当前窗口中的界面文字并执行点击。请只在你理解并信任此功能时开启。"
                      textSize = 16f
                      setPadding(0, 28, 0, 28)
                  }

                  val settingsButton = Button(this).apply {
                      text = "打开无障碍设置"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }

                  layout.addView(title)
                  layout.addView(info)
                  layout.addView(settingsButton)
                  setContentView(layout)
              }
          }
          EOF

          cat > app/src/main/java/com/example/adskip/SkipService.kt <<'EOF'
          package com.example.adskip

          import android.accessibilityservice.AccessibilityService
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.util.Locale

          class SkipService : AccessibilityService() {
              private var lastClickTime = 0L

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val eventType = event?.eventType ?: return
                  if (eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                      eventType != AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED) return

                  val now = SystemClock.uptimeMillis()
                  if (now - lastClickTime < 800L) return

                  val root = rootInActiveWindow ?: return
                  if (root.packageName?.toString() == packageName) return

                  for (keyword in KEYWORDS) {
                      val matches = root.findAccessibilityNodeInfosByText(keyword)
                      for (node in matches) {
                          val label = (node.text?.toString()
                              ?: node.contentDescription?.toString()
                              ?: "").trim().lowercase(Locale.ROOT)

                          if (!isExplicitSkipLabel(label)) continue
                          if (clickClickableParent(node)) {
                              lastClickTime = now
                              return
                          }
                      }
                  }
              }

              private fun isExplicitSkipLabel(label: String): Boolean {
                  return label == "跳过" ||
                      label == "跳过广告" ||
                      label == "跳過" ||
                      label == "跳過廣告" ||
                      label == "skip" ||
                      label == "skip ad" ||
                      label == "skip ads"
              }

              private fun clickClickableParent(node: AccessibilityNodeInfo): Boolean {
                  var current: AccessibilityNodeInfo? = node
                  var depth = 0
                  while (current != null && depth < 5) {
                      if (current.isVisibleToUser && current.isEnabled && current.isClickable) {
                          return current.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      }
                      current = current.parent
                      depth++
                  }
                  return false
              }

              override fun onInterrupt() = Unit

              companion object {
                  private val KEYWORDS = listOf(
                      "跳过", "跳過", "Skip", "skip ad", "skip ads"
                  )
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adskip-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
